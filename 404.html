<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Halyard has closed</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1c1c1a; --muted:#6b6a65; --link:#1f5fbf; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#ecebe6; --muted:#a3a29c; --link:#7fb0ff; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding:0 16px; }
  main { max-width:32rem; }
  h1 { font-size:1.6rem; margin:0 0 .5rem; }
  p { color:var(--muted); margin:.5rem 0; }
  a { color:var(--link); }
</style>
</head>
<body>
<main>
  <h1>Halyard has closed</h1>
  <p>Halyard never opened for real trading, and the practice arena is now offline.</p>
  <p>We are building a new exchange instead: <a href="https://slipway.exchange">Slipway</a>.</p>
</main>
</body>
</html>
